<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Aivota</title>
    <meta
      name="description"
      content="Professional clinical dashboard for SLP practitioners with AI-powered AAC tools and workflow management"
    />
    <!--
      Social-share card. `npm run prerender:landing` overwrites the title,
      description and og:* tags per locale in dist/public/{locale}/index.html;
      these are the defaults every non-prerendered route (login, the app itself,
      a dev build) unfurls with. og:image has to be an ABSOLUTE url — relative
      paths are ignored by most unfurlers — so the production origin is written
      out literally here rather than derived; change it if the domain moves.
      The image itself is generated by `npm run og:image`; don't hand-edit
      client/public/og-image.png.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aivota" />
    <meta property="og:title" content="Aivota" />
    <meta
      property="og:description"
      content="Professional clinical dashboard for SLP practitioners with AI-powered AAC tools and workflow management"
    />
    <meta property="og:image" content="https://aivota.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://aivota.ai/og-image.png" />
    <!--
      Icons. All of these are generated together by scripts/generate-web-icons.mjs
      (npm run icons:web) from attached_assets/aivota_icon.png — do not hand-edit
      the files in client/public.

      Declaring the whole set matters: a browser TAB uses rel="icon", but Chrome's
      "create shortcut" / install path does not. Without a manifest it falls back
      to icon candidates it collects itself (the implicit /favicon.ico, an
      auto-probed /apple-touch-icon.png) and prefers an exact pixel-size match
      over downscaling a big PNG — which is how a stale .ico kept supplying the
      old logo to desktop shortcuts long after the tab icon was updated.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Both font hosts and the icon CDN are render-blocking stylesheets, so
         open the connections in parallel with the HTML parse rather than
         paying DNS + TLS serially once the parser reaches each <link>. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
    />
    <style>
      body{margin:0;background:#18181b}
      .splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#e5e7eb;font-family:system-ui,-apple-system,sans-serif}
      .splash-title{font-size:1.75rem;font-weight:600;color:#27272a;margin:0 0 2rem;letter-spacing:-.02em}
      .splash-spinner{width:36px;height:36px;border:3px solid #27272a;border-top-color:#6366f1;border-radius:50%;animation:splash-spin 0.8s linear infinite;margin-bottom:1rem}
      .splash-text{font-size:.875rem;color:#6b7280;margin:0;animation:splash-fade 2s ease-in-out infinite}
      @keyframes splash-spin{to{transform:rotate(360deg)}}
      @keyframes splash-fade{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-title">Aivota</div>
        <div class="splash-spinner"></div>
        <p class="splash-text">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
