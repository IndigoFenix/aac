<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>World Lab</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header id="bar">
      <h1>🌍 World Lab</h1>
      <label for="world-select">Test game</label>
      <select id="world-select"></select>
      <label for="lang-select">Language</label>
      <select id="lang-select" title="The world's locale: glyph sentences, NPC speech, board text and RTL layout. Overrides the World form's Locale field, and rebuilds the world — the town's lang layer is chosen at build time."></select>
      <button id="reload">Build world</button>
      <button id="paths" aria-pressed="false" title="Draw creature pathfinding: cyan = planned route, yellow = current leg, red = detour-bent aim, grey = wander">🧭 Paths</button>
      <button id="nations" aria-pressed="false" title="Show who holds the planet: state borders, territory wash, crown flags on every beacon — plus the political-history scrubber">👑 Nations</button>
      <span id="status">—</span>
    </header>
    <div id="layout">
      <div id="world-file" class="lab-form" aria-label="World form"></div>
      <div id="view"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
