<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Seagull Dream</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="crosshair"></div>
    <div id="hud">
      <span id="state-label">walking</span>
      <span id="hint">move mouse to walk · drift mouse up and far to take off</span>
    </div>

    <!-- Debug toolbar: small always-visible row of buttons that toggle the
         tuning / readouts / generation panels. The panels themselves are
         constructed programmatically by src/debug-ui.ts. -->
    <div id="debug-toolbar">
      <button class="dbg-btn" data-panel="readouts">readouts</button>
      <button class="dbg-btn" data-panel="tuning">tuning</button>
      <button class="dbg-btn" data-panel="generation">generation</button>
    </div>

    <div id="readouts-panel" class="dbg-panel"></div>
    <div id="tuning-panel" class="dbg-panel"></div>
    <div id="generation-panel" class="dbg-panel"></div>

    <div id="pause-overlay">
      <div class="pause-card">
        <div class="pause-title">paused</div>
        <div class="pause-hint">press Esc to resume</div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
