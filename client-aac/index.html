<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body{margin:0;background:#e5e7eb}
      .splash{display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,-apple-system,sans-serif}
      .splash-inner{text-align:center}
      .splash-logo{position:relative;width:96px;height:96px;margin:0 auto 2rem}
      .splash-ring{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#a855f7,#7c3aed);animation:splash-spin 3s linear infinite}
      .splash-ring-inner{position:absolute;inset:8px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center}
      .splash-ring-inner img{width:48px;height:48px;object-fit:contain}
      .splash-title{font-size:2.25rem;font-weight:700;background:linear-gradient(90deg,#3b82f6,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0 0 0.5rem}
      .splash-subtitle{font-size:1.1rem;color:#9ca3af;margin:0 0 2rem}
      .splash-dots{display:flex;align-items:center;justify-content:center;gap:8px}
      .splash-dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;animation:splash-pulse 1.5s ease-in-out infinite}
      .splash-dot:nth-child(2){animation-delay:.3s}
      .splash-dot:nth-child(3){animation-delay:.6s}
      @keyframes splash-spin{to{transform:rotate(360deg)}}
      @keyframes splash-pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.2);opacity:1}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-inner">
          <div class="splash-logo">
            <div class="splash-ring"></div>
            <div class="splash-ring-inner">
              <img src="/aac-avatars/axolotl/axolotl-logo.png" alt="Aivota AAC" />
            </div>
          </div>
          <h1 class="splash-title">Aivota AAC</h1>
          <p class="splash-subtitle">Advanced Communication Platform</p>
          <div class="splash-dots">
            <div class="splash-dot"></div>
            <div class="splash-dot"></div>
            <div class="splash-dot"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
