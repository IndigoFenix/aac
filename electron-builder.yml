appId: com.aivota.aac
productName: Aivota AAC

directories:
  output: release

files:
  - dist-electron/**/*
  - dist/public-aac/**/*
  - package.json
  - "!node_modules"

# Gaze sidecar (assembled by scripts/build-sidecar.mjs). Shipped OUTSIDE the asar
# so the native koffi .node and the bundled 32-bit node.exe are loadable/spawnable.
# Lands at resources/gaze-sidecar (see gazeSupervisorPaths in electron/main.ts).
extraResources:
  - from: dist-sidecar/gaze-sidecar
    to: gaze-sidecar

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Aivota AAC
