appId: com.xahaph.aac
productName: Xahaph AAC

directories:
  output: release

files:
  - dist-electron/**/*
  - dist/public-aac/**/*
  - package.json
  - "!node_modules"

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/resources/icon.png
  signingHashAlgorithms: null
  sign: null

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Xahaph AAC
