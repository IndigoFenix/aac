appId: com.aivota.aac
productName: Aivota AAC

directories:
  output: release

files:
  - dist-electron/**/*
  - dist/public-aac/**/*
  - package.json
  - "!node_modules"

# Gaze sidecar (assembled by scripts/build-sidecar.mjs). Shipped OUTSIDE the asar
# so the native koffi .node and the bundled 32-bit node.exe are loadable/spawnable.
# Lands at resources/gaze-sidecar (see gazeSupervisorPaths in electron/main.ts).
extraResources:
  - from: dist-sidecar/gaze-sidecar
    to: gaze-sidecar

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Aivota AAC

# Auto-update channel — electron-updater fetches latest.yml from this URL on
# launch (and every ~10 minutes thereafter while the app is running). When
# the manifest's `version` is newer than the installed build, the new
# installer is downloaded in the background and applied on next quit.
#
# `generic` provider: a static URL that serves the artifacts. Point this at
# S3 + CloudFront (or any static host). The release script (npm run
# release:aac) syncs `release/` to this prefix after a packaged build.
#
# The URL MUST be a literal. electron-builder's macro expander only matches
# `${...}` bodies of `[_a-zA-Z./*+]` (no `:`), so the old
# `${env.AAC_UPDATE_URL:https://...}` default-value form never expanded — it
# was written verbatim into app-update.yml and every client polled a
# non-URL, so auto-update silently failed. There is no inline env-with-
# default syntax. To override for a beta / per-tenant feed, set AAC_UPDATE_URL
# and the build script passes `-c.publish.url` to electron-builder.
publish:
  provider: generic
  url: https://updates.aivota.ai/aac/win/
  channel: latest
