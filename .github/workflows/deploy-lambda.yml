name: Deploy to AWS Lambda

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION: il-central-1

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================
  # Security Scanning
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ===========================================
  # Infrastructure (Terraform)
  # ===========================================
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    outputs:
      frontend_bucket: ${{ steps.tf-outputs.outputs.frontend_bucket }}
      lambda_function: ${{ steps.tf-outputs.outputs.lambda_function }}
      cloudfront_id: ${{ steps.tf-outputs.outputs.cloudfront_id }}
      lambda_ecr_url: ${{ steps.tf-outputs.outputs.lambda_ecr_url }}
      lambda_exists: ${{ steps.tf-outputs.outputs.lambda_exists }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=cliniaacian/${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="environment=${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf-outputs
        if: github.event_name == 'push'
        working-directory: terraform
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "lambda_function=$(terraform output -raw lambda_function_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "lambda_ecr_url=$(terraform output -raw lambda_ecr_repository_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          # Check if Lambda function exists
          if [ -n "$(terraform output -raw lambda_function_name 2>/dev/null || echo '')" ]; then
            echo "lambda_exists=true" >> $GITHUB_OUTPUT
          else
            echo "lambda_exists=false" >> $GITHUB_OUTPUT
          fi

  # ===========================================
  # Build Frontend
  # ===========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event_name == 'push' && needs.infrastructure.outputs.frontend_bucket != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:client
        env:
          NODE_ENV: production
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/public/
          retention-days: 1

  # ===========================================
  # Build and Push Lambda Image
  # ===========================================
  build-lambda:
    name: Build Lambda Image
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event_name == 'push' && needs.infrastructure.outputs.lambda_ecr_url != ''
    
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_URL: ${{ needs.infrastructure.outputs.lambda_ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.lambda -t $ECR_URL:$IMAGE_TAG .
          docker push $ECR_URL:$IMAGE_TAG
          docker tag $ECR_URL:$IMAGE_TAG $ECR_URL:latest
          docker push $ECR_URL:latest
          echo "image=$ECR_URL:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ===========================================
  # Deploy Frontend to S3
  # ===========================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [infrastructure, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.infrastructure.outputs.frontend_bucket != ''

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/public/

      - name: Deploy to S3
        env:
          BUCKET: ${{ needs.infrastructure.outputs.frontend_bucket }}
        run: |
          echo "Deploying to bucket: $BUCKET"
          
          aws s3 sync dist/public/ s3://$BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"
          
          # Upload index.html with no-cache
          aws s3 cp dist/public/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          
          # Upload JSON files with short cache
          for f in $(find dist/public -name "*.json" -type f 2>/dev/null); do
            key="${f#dist/public/}"
            aws s3 cp "$f" "s3://$BUCKET/$key" \
              --cache-control "public, max-age=0, must-revalidate"
          done

      - name: Invalidate CloudFront cache
        env:
          CF_ID: ${{ needs.infrastructure.outputs.cloudfront_id }}
        if: env.CF_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_ID \
            --paths "/*"

  # ===========================================
  # Deploy Lambda
  # ===========================================
  deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [infrastructure, build-lambda]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.infrastructure.outputs.lambda_exists == 'true'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function
        env:
          FUNCTION: ${{ needs.infrastructure.outputs.lambda_function }}
        run: |
          echo "Updating Lambda function: $FUNCTION"
          
          aws lambda update-function-code \
            --function-name $FUNCTION \
            --image-uri ${{ needs.build-lambda.outputs.image }}

      - name: Wait for Lambda update
        env:
          FUNCTION: ${{ needs.infrastructure.outputs.lambda_function }}
        run: |
          aws lambda wait function-updated \
            --function-name $FUNCTION

      - name: Verify Lambda health
        env:
          FUNCTION: ${{ needs.infrastructure.outputs.lambda_function }}
        run: |
          # Get Lambda function URL
          LAMBDA_URL=$(aws lambda get-function-url-config \
            --function-name $FUNCTION \
            --query 'FunctionUrl' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$LAMBDA_URL" ]; then
            echo "No function URL configured, skipping health check"
            exit 0
          fi
          
          echo "Lambda URL: $LAMBDA_URL"
          sleep 10
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${LAMBDA_URL}health" || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Lambda is healthy!"
          else
            echo "⚠️ Health check returned: $HTTP_STATUS (may need warm-up time)"
          fi

  # ===========================================
  # Summary
  # ===========================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [infrastructure, build-frontend, build-lambda, deploy-frontend, deploy-lambda]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Lambda | ${{ needs.build-lambda.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Lambda | ${{ needs.deploy-lambda.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.infrastructure.outputs.lambda_exists }}" != "true" ]; then
            echo "⚠️ **Lambda not yet created.** Set \`lambda_image_exists = true\` in terraform.tfvars and re-run." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Domain:** https://cliniaacian.com" >> $GITHUB_STEP_SUMMARY
          fi
