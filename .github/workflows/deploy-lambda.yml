name: Deploy to AWS Lambda

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_profile:
        description: 'Deployment profile (full = all security/monitoring, lean = minimal cost)'
        required: true
        default: 'lean'
        type: choice
        options:
          - full
          - lean

env:
  AWS_REGION: il-central-1

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================
  # Security Scanning
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ===========================================
  # Infrastructure (Terraform)
  # ===========================================
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    outputs:
      frontend_bucket: ${{ steps.tf-outputs.outputs.frontend_bucket }}
      lambda_function: ${{ steps.tf-outputs.outputs.lambda_function }}
      cloudfront_id: ${{ steps.tf-outputs.outputs.cloudfront_id }}
      lambda_ecr_url: ${{ steps.tf-outputs.outputs.lambda_ecr_url }}
      lambda_exists: ${{ steps.tf-outputs.outputs.lambda_exists }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Ensure Terraform state backend exists
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          # Create S3 state bucket if it doesn't exist
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Creating Terraform state bucket: $STATE_BUCKET"
            aws s3api create-bucket \
              --bucket "$STATE_BUCKET" \
              --region "${{ env.AWS_REGION }}" \
              --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
            aws s3api put-bucket-versioning \
              --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          # Create DynamoDB lock table if it doesn't exist
          if ! aws dynamodb describe-table --table-name terraform-state-lock --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Creating DynamoDB lock table: terraform-state-lock"
            aws dynamodb create-table \
              --table-name terraform-state-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}"
            aws dynamodb wait table-exists --table-name terraform-state-lock --region "${{ env.AWS_REGION }}"
          fi

          # Fix stale DynamoDB digest: if the state checksum doesn't match the
          # digest stored in DynamoDB, delete the stale digest entry so
          # terraform init can re-read the state cleanly.
          STATE_KEY="cliniaacian/${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}/terraform.tfstate"
          LOCK_ID="${STATE_BUCKET}/${STATE_KEY}-md5"
          STORED_DIGEST=$(aws dynamodb get-item \
            --table-name terraform-state-lock \
            --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Item.Digest.S" --output text 2>/dev/null || echo "")

          if [ -n "$STORED_DIGEST" ] && [ "$STORED_DIGEST" != "None" ]; then
            # Calculate actual checksum of the state file in S3
            ACTUAL_MD5=$(aws s3api head-object \
              --bucket "$STATE_BUCKET" \
              --key "$STATE_KEY" \
              --region "${{ env.AWS_REGION }}" \
              --query "ETag" --output text 2>/dev/null | tr -d '"' || echo "")

            if [ "$STORED_DIGEST" != "$ACTUAL_MD5" ]; then
              echo "DynamoDB digest mismatch (stored=$STORED_DIGEST, actual=$ACTUAL_MD5). Removing stale entry."
              aws dynamodb delete-item \
                --table-name terraform-state-lock \
                --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
                --region "${{ env.AWS_REGION }}"
            fi
          fi

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=cliniaacian/${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Clean up orphaned state and import existing resources
        working-directory: terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          PROFILE="${{ github.event.inputs.deploy_profile || 'full' }}"
          ENV="${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}"

          # Build the same var flags used by terraform plan
          TF_VAR_FLAGS="-var=environment=${ENV} -var=aws_region=${{ env.AWS_REGION }}"
          if [ "$PROFILE" = "lean" ]; then
            TF_VAR_FLAGS="-var-file=lean.tfvars"
          fi

          # Check if state has existing resources that need the old VPC
          # (i.e., resources referencing the real infrastructure, not just
          # the duplicates from a failed apply)
          REAL_RESOURCE_COUNT=$(terraform state list 2>/dev/null | grep -v "^data\." | wc -l || echo "0")

          if [ "$REAL_RESOURCE_COUNT" -gt 20 ]; then
            echo "State has $REAL_RESOURCE_COUNT resources, skipping import."
            exit 0
          fi

          echo "State has $REAL_RESOURCE_COUNT resources. Cleaning up and importing..."

          # Remove any resources from a partial failed apply (duplicates)
          echo "--- Removing orphaned resources from state ---"
          for res in $(terraform state list 2>/dev/null || true); do
            echo "Removing from state: $res"
            terraform state rm "$res" 2>/dev/null || true
          done

          # Now destroy the duplicate resources that were actually created
          # (new VPC, subnets, etc. from the failed run)
          # These have known IDs from the error output — we clean them via
          # AWS CLI to avoid needing them in state.

          # Clean up duplicate resources from the failed 2026-03-06 apply.
          # These are orphaned — not in any state file.
          echo "--- Cleaning up orphaned duplicate resources ---"
          # Duplicate API Gateway (original found by name; this duplicate would cause ambiguity)
          aws apigatewayv2 delete-api --api-id j7sbhgbvg7 --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          # Duplicate KMS key (schedule deletion; original found via alias)
          aws kms schedule-key-deletion --key-id 57dca2f8-2526-4641-802b-45f2b161e3f8 --pending-window-in-days 7 --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          # Duplicate VPC networking — delete NATs first, then the rest
          for nat in nat-06a61514c7c3db90e nat-0144be9c5f13b2456; do
            aws ec2 delete-nat-gateway --nat-gateway-id "$nat" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done
          echo "Waiting for NAT gateway deletion..."
          sleep 45
          for eip in eipalloc-0ded4cae6091f3c1a eipalloc-0788103ed297ce96e; do
            aws ec2 release-address --allocation-id "$eip" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done
          for vpce in vpce-06d758b96ea2b60ae vpce-0902ce65c97e9dc15 vpce-0438e1ad64f98b8ec vpce-08b1da44714964da6 vpce-0eea8bf8b31a17da5; do
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids "$vpce" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done
          for assoc in rtbassoc-0f9006c812a64e8b0 rtbassoc-08f27b2dbefec9ede rtbassoc-09cc2ef3836e3a840 rtbassoc-06eeb1f1faa493135; do
            aws ec2 disassociate-route-table --association-id "$assoc" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done
          for rt in rtb-06e39e85408b26c48 rtb-041b3939d864e60c6 rtb-06538bf25766ced63; do
            aws ec2 delete-route-table --route-table-id "$rt" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done
          for sg in sg-07f6aaa63bb770714 sg-0bf653b183009e649 sg-04328a11bdf1c1124 sg-01ed9c008e12f4c4e sg-0a8aae9886fc43260 sg-0b6f34a73c8e8328c sg-08a0d2c4295e2d0dc; do
            aws ec2 delete-security-group --group-id "$sg" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done
          for subnet in subnet-0f4ba8ae5c8063ccb subnet-01303d977ff81bdfe subnet-0101962e2e7a52486 subnet-0b98a321a15098a3f; do
            aws ec2 delete-subnet --subnet-id "$subnet" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done
          aws ec2 detach-internet-gateway --internet-gateway-id igw-0bd57ac4ca267a04d --vpc-id vpc-022fbcaaf2da67d74 --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          aws ec2 delete-internet-gateway --internet-gateway-id igw-0bd57ac4ca267a04d --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          aws ec2 delete-vpc --vpc-id vpc-022fbcaaf2da67d74 --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          # Duplicate ACM cert (us-east-1)
          aws acm delete-certificate --certificate-arn "arn:aws:acm:us-east-1:748560966885:certificate/2065bdd0-638d-4154-89c8-0eb344e285eb" --region us-east-1 2>/dev/null || true

          echo "--- Importing existing resources ---"
          chmod +x import-existing.sh
          export TF_VAR_FLAGS
          bash import-existing.sh

      - name: Migrate State for Lambda Resources
        working-directory: terraform
        continue-on-error: true
        run: |
          # Migrate resources that changed from non-indexed to indexed
          terraform state mv aws_ecr_repository.lambda aws_ecr_repository.lambda[0] 2>/dev/null || true
          terraform state mv aws_ecr_lifecycle_policy.lambda aws_ecr_lifecycle_policy.lambda[0] 2>/dev/null || true
          terraform state mv aws_iam_role.lambda_execution aws_iam_role.lambda_execution[0] 2>/dev/null || true
          terraform state mv aws_iam_role_policy_attachment.lambda_basic aws_iam_role_policy_attachment.lambda_basic[0] 2>/dev/null || true
          terraform state mv aws_iam_role_policy_attachment.lambda_vpc aws_iam_role_policy_attachment.lambda_vpc[0] 2>/dev/null || true
          terraform state mv aws_iam_role_policy.lambda_secrets aws_iam_role_policy.lambda_secrets[0] 2>/dev/null || true
          terraform state mv aws_iam_role_policy.lambda_s3 aws_iam_role_policy.lambda_s3[0] 2>/dev/null || true
          terraform state mv aws_security_group.lambda aws_security_group.lambda[0] 2>/dev/null || true
          terraform state mv aws_cloudwatch_log_group.lambda aws_cloudwatch_log_group.lambda[0] 2>/dev/null || true

          terraform state rm aws_security_group_rule.rds_from_lambda[0] 2>/dev/null || true
          terraform state rm aws_security_group_rule.rds_from_lambda 2>/dev/null || true

      - name: Migrate State for Lean Mode Resources
        working-directory: terraform
        continue-on-error: true
        run: |
          # VPC interface endpoints (added count for lean mode toggle)
          terraform state mv aws_vpc_endpoint.ecr_api aws_vpc_endpoint.ecr_api[0] 2>/dev/null || true
          terraform state mv aws_vpc_endpoint.ecr_dkr aws_vpc_endpoint.ecr_dkr[0] 2>/dev/null || true
          terraform state mv aws_vpc_endpoint.secretsmanager aws_vpc_endpoint.secretsmanager[0] 2>/dev/null || true
          terraform state mv aws_vpc_endpoint.logs aws_vpc_endpoint.logs[0] 2>/dev/null || true
          terraform state mv aws_security_group.vpc_endpoints aws_security_group.vpc_endpoints[0] 2>/dev/null || true

          # CloudTrail (added count for lean mode toggle)
          terraform state mv aws_cloudtrail.main aws_cloudtrail.main[0] 2>/dev/null || true
          terraform state mv aws_cloudwatch_log_group.cloudtrail aws_cloudwatch_log_group.cloudtrail[0] 2>/dev/null || true
          terraform state mv aws_iam_role.cloudtrail aws_iam_role.cloudtrail[0] 2>/dev/null || true
          terraform state mv aws_iam_role_policy.cloudtrail aws_iam_role_policy.cloudtrail[0] 2>/dev/null || true

          # VPC flow logs (added count for lean mode toggle)
          terraform state mv aws_flow_log.main aws_flow_log.main[0] 2>/dev/null || true
          terraform state mv aws_cloudwatch_log_group.vpc_flow_logs aws_cloudwatch_log_group.vpc_flow_logs[0] 2>/dev/null || true
          terraform state mv aws_iam_role.vpc_flow_logs aws_iam_role.vpc_flow_logs[0] 2>/dev/null || true
          terraform state mv aws_iam_role_policy.vpc_flow_logs aws_iam_role_policy.vpc_flow_logs[0] 2>/dev/null || true

          # RDS enhanced monitoring (added count for lean mode toggle)
          terraform state mv aws_iam_role.rds_monitoring aws_iam_role.rds_monitoring[0] 2>/dev/null || true
          terraform state mv aws_iam_role_policy_attachment.rds_monitoring aws_iam_role_policy_attachment.rds_monitoring[0] 2>/dev/null || true

      - name: Terraform Plan
        working-directory: terraform
        run: |
          PROFILE="${{ github.event.inputs.deploy_profile || 'full' }}"
          VAR_FILE_FLAG=""
          if [ "$PROFILE" = "lean" ]; then
            VAR_FILE_FLAG="-var-file=lean.tfvars"
            echo "::notice::Using LEAN deployment profile (security/monitoring disabled)"
          fi

          terraform plan \
            $VAR_FILE_FLAG \
            -var="environment=${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf-outputs
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: |
          # Get outputs, defaulting to empty string if not found
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name 2>/dev/null || echo '')
          LAMBDA_FUNCTION=$(terraform output -raw lambda_function_name 2>/dev/null || echo '')
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo '')
          LAMBDA_ECR_URL=$(terraform output -raw lambda_ecr_repository_url 2>/dev/null || echo '')
          
          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "lambda_function=$LAMBDA_FUNCTION" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT
          echo "lambda_ecr_url=$LAMBDA_ECR_URL" >> $GITHUB_OUTPUT
          
          # Check if Lambda function exists
          if [ -n "$LAMBDA_FUNCTION" ]; then
            echo "lambda_exists=true" >> $GITHUB_OUTPUT
          else
            echo "lambda_exists=false" >> $GITHUB_OUTPUT
          fi

  # ===========================================
  # Build Frontend (Phase 1+)
  # ===========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event_name != 'pull_request' && needs.infrastructure.outputs.frontend_bucket != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (main + AAC)
        run: |
          npm run build:client
          npm run build:client-aac
        env:
          NODE_ENV: production
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            dist/public/
            dist/public-aac/
          retention-days: 1

  # ===========================================
  # Build and Push Lambda Image (Phase 1+)
  # ===========================================
  build-lambda:
    name: Build Lambda Image
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event_name != 'pull_request' && needs.infrastructure.outputs.lambda_ecr_url != ''
    
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_URL: ${{ needs.infrastructure.outputs.lambda_ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --provenance=false -f Dockerfile.lambda -t $ECR_URL:$IMAGE_TAG .
          docker push $ECR_URL:$IMAGE_TAG
          docker tag $ECR_URL:$IMAGE_TAG $ECR_URL:latest
          docker push $ECR_URL:latest
          echo "image=$ECR_URL:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ===========================================
  # Deploy Frontend to S3 (Phase 1+)
  # ===========================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [infrastructure, build-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.infrastructure.outputs.frontend_bucket != ''

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Deploy to S3
        env:
          BUCKET: ${{ needs.infrastructure.outputs.frontend_bucket }}
        run: |
          echo "Deploying to bucket: $BUCKET"

          # === Main client (/) ===
          # Sync all files except index.html and JSON
          aws s3 sync dist/public/ s3://$BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json" \
            --exclude "aac/*"

          # Upload index.html with no-cache
          aws s3 cp dist/public/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          # Upload JSON files with short cache
          for f in $(find dist/public -name "*.json" -type f 2>/dev/null); do
            key="${f#dist/public/}"
            aws s3 cp "$f" "s3://$BUCKET/$key" \
              --cache-control "public, max-age=0, must-revalidate"
          done

          # === AAC client (/aac/) ===
          if [ -d "dist/public-aac" ]; then
            echo "Deploying AAC client to /aac/"

            # Sync AAC files under /aac/ prefix
            aws s3 sync dist/public-aac/ s3://$BUCKET/aac/ \
              --delete \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude "index.html" \
              --exclude "*.json"

            # Upload AAC index.html with no-cache
            aws s3 cp dist/public-aac/index.html s3://$BUCKET/aac/index.html \
              --cache-control "no-cache, no-store, must-revalidate"

            # Upload AAC JSON files with short cache
            for f in $(find dist/public-aac -name "*.json" -type f 2>/dev/null); do
              key="${f#dist/public-aac/}"
              aws s3 cp "$f" "s3://$BUCKET/aac/$key" \
                --cache-control "public, max-age=0, must-revalidate"
            done
          fi

      - name: Invalidate CloudFront cache
        env:
          CF_ID: ${{ needs.infrastructure.outputs.cloudfront_id }}
        if: env.CF_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_ID \
            --paths "/*"

  # ===========================================
  # Deploy Lambda (Phase 2 only)
  # ===========================================
  deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [infrastructure, build-lambda]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.infrastructure.outputs.lambda_exists == 'true'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function
        env:
          FUNCTION: ${{ needs.infrastructure.outputs.lambda_function }}
        run: |
          echo "Updating Lambda function: $FUNCTION"
          
          aws lambda update-function-code \
            --function-name $FUNCTION \
            --image-uri ${{ needs.build-lambda.outputs.image }}

      - name: Wait for Lambda update
        env:
          FUNCTION: ${{ needs.infrastructure.outputs.lambda_function }}
        run: |
          aws lambda wait function-updated \
            --function-name $FUNCTION

      - name: Verify Lambda health
        env:
          FUNCTION: ${{ needs.infrastructure.outputs.lambda_function }}
        run: |
          LAMBDA_URL=$(aws lambda get-function-url-config \
            --function-name $FUNCTION \
            --query 'FunctionUrl' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$LAMBDA_URL" ]; then
            echo "No function URL configured, skipping health check"
            exit 0
          fi
          
          echo "Lambda URL: $LAMBDA_URL"
          sleep 10
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${LAMBDA_URL}health" || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Lambda is healthy!"
          else
            echo "⚠️ Health check returned: $HTTP_STATUS (may need warm-up time)"
          fi

  # ===========================================
  # Summary
  # ===========================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [infrastructure, build-frontend, build-lambda, deploy-frontend, deploy-lambda]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Lambda | ${{ needs.build-lambda.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Lambda | ${{ needs.deploy-lambda.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.infrastructure.outputs.lambda_exists }}" != "true" ]; then
            echo "### ⚠️ Phase 1 Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Lambda image has been pushed to ECR." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Set \`lambda_image_exists = true\` in \`terraform/terraform.tfvars\`" >> $GITHUB_STEP_SUMMARY
            echo "2. Commit and push to trigger Phase 2 deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Phase 2 Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Domain:** https://aivota.ai" >> $GITHUB_STEP_SUMMARY
          fi
