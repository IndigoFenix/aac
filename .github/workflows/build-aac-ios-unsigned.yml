name: Build AAC iPad (unsigned)

# Builds the Aivota AAC iPad app WITHOUT code signing and uploads the resulting
# .ipa as a run artifact. Counterpart to release-aac-ios.yml (which signs and
# ships to TestFlight) for the case where no paid Apple Developer Program
# membership / App Store Connect credentials exist yet.
#
# WHAT THIS IS FOR: getting a testable build onto a physical iPad via Apple's
# free provisioning, before the paid pipeline is set up. The artifact this
# produces is an UNSIGNED .ipa. It cannot be installed directly and it cannot
# go through TestFlight — it must be re-signed onto a device with a free Apple
# ID using a sideload tool:
#
#   • Sideloadly (Windows or macOS) — https://sideloadly.io
#   • AltStore (Windows or macOS)   — https://altstore.io
#
# Those tools sign the app with your free Apple ID and install it over USB.
# Free-provisioning limits apply: the app EXPIRES AFTER 7 DAYS (reinstall to
# renew), ~3 apps / 3 devices per Apple ID, no push notifications, no OTA
# bundle updates. The bundle id com.aivota.aac may be rewritten to a unique id
# by the sideload tool — that is expected and fine for testing.
#
# WHY A macOS RUNNER: iOS apps can only be compiled by Xcode, which is
# macOS-only. Building unsigned still needs Xcode; only the signing/upload
# steps are removed. No secrets are required to run this workflow.
#
# This also doubles as the iOS build smoke test — if the web bundle, the
# Capacitor project generation, or the Xcode compile break, this fails here
# without needing any Apple account.
#
# DISTRIBUTION: with `publish` on (the default), the .ipa is also uploaded to
# the AAC download feed (s3 → https://updates.aivota.ai/aac/ios/) so clinicians
# can fetch it themselves from the dashboard's Downloads page instead of it
# being emailed around. That needs the AWS_ROLE_ARN secret; uncheck `publish`
# to build without it.
#
# Trigger: manual only (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend the build talks to (baked as VITE_API_URL)'
        required: false
        default: 'https://api.aivota.ai'
      publish:
        description: 'Publish the .ipa to the download feed (clinician Downloads panel)'
        type: boolean
        required: false
        default: true

permissions:
  id-token: write   # GitHub OIDC -> AWS role assumption (publish step)
  contents: read

concurrency:
  group: build-aac-ios-unsigned
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned .ipa
    # Must stay identical to release-aac-ios.yml, runner and Xcode pin both:
    # this workflow is the iOS smoke test, and a smoke test on a different
    # toolchain than the release build proves nothing about the release build.
    runs-on: macos-15
    timeout-minutes: 60

    env:
      XCODE_VERSION: '26'
      MIN_IOS_SDK: '26.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sideloaded builds never face App Store Connect, so the SDK floor is not
      # a hard requirement here — it is asserted anyway so that this cheap
      # workflow is what catches a toolchain drift, before the signed one does.
      - name: Pin Xcode and verify the iOS SDK
        run: |
          echo "Xcode versions on this runner image:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"

          # `|| true`: this step runs under `bash -eo pipefail`, where an `ls`
          # that matches nothing would abort before the legible error below.
          CANDIDATES=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null || true)
          # Version sort, so 26.10 beats 26.2. BSD sort has taken -V for years
          # but the fallback keeps a missing flag from reading as a missing Xcode.
          SORT_FLAGS='-Vr'
          printf '1.0\n' | sort -Vr >/dev/null 2>&1 || SORT_FLAGS='-r'
          DEV=""
          if [ -n "$CANDIDATES" ]; then
            DEV="$(printf '%s\n' "$CANDIDATES" | sort $SORT_FLAGS | head -1)/Contents/Developer"
          fi
          if [ -z "$CANDIDATES" ] || [ ! -d "$DEV" ]; then
            echo "::error::No Xcode ${XCODE_VERSION}.x on this runner image. Pick one from the list above and set XCODE_VERSION at the top of this workflow AND of release-aac-ios.yml — the two must match."
            exit 1
          fi
          sudo xcode-select -s "$DEV"
          xcodebuild -version

          SDK=$(xcodebuild -version -sdk iphoneos SDKVersion)
          echo "iOS SDK: $SDK (required minimum $MIN_IOS_SDK)"
          awk -v have="$SDK" -v want="$MIN_IOS_SDK" 'BEGIN {
            split(have, h, "."); split(want, w, ".");
            for (i = 1; i <= 3; i++) {
              if (h[i] + 0 > w[i] + 0) exit 0;
              if (h[i] + 0 < w[i] + 0) exit 1;
            }
            exit 0
          }' || {
            echo "::error::iOS SDK $SDK is below App Store Connect's minimum of $MIN_IOS_SDK. This build would sideload fine, but the signed workflow's upload would be rejected — fix the pin here before releasing."
            exit 1
          }

          echo "XCODE_SELECTED=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Builds dist/public-aac with a RELATIVE asset base (NATIVE_BUILD=1) and
      # the backend baked in. Identical bundle to the Windows build except for
      # VITE_API_URL.
      - name: Build web bundle
        env:
          VITE_API_URL: ${{ inputs.backend_url }}
          # Runtime backend manifest (client-aac/src/lib/api-base.ts): lets an
          # installed build be re-pointed without a new TestFlight release.
          VITE_BACKEND_MANIFEST_URL: https://updates.aivota.ai/aac/latest-backend.json
        run: npm run ios:build

      # `ios/` is gitignored; generate it fresh from the Capacitor template.
      #
      # --packagemanager CocoaPods is REQUIRED. Capacitor 8 defaults `cap add`
      # to Swift Package Manager (see @capacitor/cli: the default template is
      # ios-spm-template.tar.gz), and the SPM template ships NO standalone
      # App.xcworkspace and NO Podfile — so the "Archive (unsigned)" step below,
      # which builds `-workspace App.xcworkspace`, fails with "App.xcworkspace
      # does not exist." The CocoaPods template restores the workspace.
      # Capacitor then detects the package manager by artifact (absence of
      # CapApp-SPM/ ⇒ CocoaPods), so `cap sync` runs `pod install`.
      - name: Generate iOS project
        run: npx cap add ios --packagemanager CocoaPods

      # Copies the web bundle in, runs `pod install`, then applies our
      # Info.plist customizations. See scripts/ios-configure.mjs.
      - name: Sync + configure iOS project
        run: npm run ios:sync

      # Fail here with a clear message rather than deep inside xcodebuild if the
      # workspace is missing — the symptom of an SPM project sneaking back in.
      - name: Verify Xcode workspace exists
        run: |
          if [ ! -d ios/App/App.xcworkspace ]; then
            echo "::error::ios/App/App.xcworkspace was not generated — Capacitor produced an SPM project. Check that 'Generate iOS project' used --packagemanager CocoaPods and that pod install ran."
            ls -la ios/App || true
            exit 1
          fi
          echo "Found ios/App/App.xcworkspace."

      # Stamp the marketing version from package.json for traceability. The
      # build number is the run number. Neither is required for sideloading,
      # but it makes an installed build identifiable.
      - name: Set version and build number
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Marketing version: $VERSION, build: $GITHUB_RUN_NUMBER"
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" App/Info.plist

      # Archive with signing fully disabled. No certificate, profile, team, or
      # API key is needed. The archive holds an unsigned App.app under
      # Products/Applications.
      - name: Archive (unsigned)
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # Package the unsigned App.app into an .ipa by hand. `xcodebuild
      # -exportArchive` can't help here — every export method needs a signing
      # identity — so we build the Payload/ layout an .ipa is (just a zip) and
      # let the sideload tool sign it later.
      - name: Package unsigned .ipa
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected app not found at $APP — archive step may have failed."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          VERSION=$(node -p "require('./package.json').version")
          IPA="$RUNNER_TEMP/aivota-aac-ipad-unsigned-v${VERSION}-build${GITHUB_RUN_NUMBER}.ipa"
          (cd "$RUNNER_TEMP" && zip -qr "$IPA" Payload)
          echo "Built $IPA"
          ls -lh "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivota-aac-ipad-unsigned-ipa
          path: ${{ runner.temp }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      # ── Publish to the download feed ─────────────────────────────────────
      # Puts the .ipa (and a latest.json manifest) in the same S3 bucket the
      # Windows auto-updater uses, under aac/ios/. Nothing polls it — an .ipa
      # cannot self-update — but it is what the clinician dashboard's Downloads
      # panel serves, which replaces emailing the file by hand.
      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.publish }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-aac-ios-release
          aws-region: il-central-1

      # Same derivation as release-aac.yml — never hardcode the account id.
      - name: Resolve update bucket
        if: ${{ inputs.publish }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "AAC_UPDATE_BUCKET=aivota-prod-aac-updates-${ACCOUNT}" >> "$GITHUB_ENV"
          echo "Resolved bucket: aivota-prod-aac-updates-${ACCOUNT}"

      - name: Publish .ipa to download feed
        if: ${{ inputs.publish }}
        env:
          AAC_UPDATE_REGION: il-central-1   # bucket lives in il-central-1, not the script's us-east-1 default
        run: node scripts/publish-aac-ios.mjs "$IPA_PATH" "$GITHUB_RUN_NUMBER"

      - name: Summary
        run: |
          {
            echo "### Aivota AAC iPad — unsigned build"
            echo ""
            echo "- Version: $(node -p "require('./package.json').version") (build $GITHUB_RUN_NUMBER)"
            echo "- Backend: ${{ inputs.backend_url }}"
            echo "- Toolchain: Xcode ${XCODE_SELECTED:-unknown}, iOS SDK ${IOS_SDK:-unknown}"
            echo "- Published to download feed: ${{ inputs.publish }}"
            echo ""
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "Clinicians can now get this build from the dashboard's **Downloads**"
              echo "page (AAC section), which also carries the Sideloadly walkthrough."
              echo ""
            fi
            echo "Download the .ipa from this run's artifacts, then install it on a"
            echo "physical iPad with a **free** Apple ID using a sideload tool:"
            echo ""
            echo "- Sideloadly (Windows/macOS): https://sideloadly.io"
            echo "- AltStore (Windows/macOS): https://altstore.io"
            echo ""
            echo "The tool re-signs the app with your Apple ID over USB. The install"
            echo "**expires after 7 days** under free provisioning — reinstall to renew."
          } >> "$GITHUB_STEP_SUMMARY"
