name: Release AAC iPad (TestFlight)

# Builds the Aivota AAC iPad app SIGNED and uploads it to TestFlight. Counterpart
# to release-aac.yml (Windows installer) and to build-aac-ios-unsigned.yml —
# the two iOS workflows are deliberately split by delivery path so there is no
# ambiguity about which one to run:
#
#   build-aac-ios-unsigned.yml  → unsigned .ipa artifact, installed via
#                                 Sideloadly/AltStore with a free Apple ID.
#                                 No Apple secrets. Use this for early testing.
#   release-aac-ios.yml (THIS)  → signed build to TestFlight. Needs a paid
#                                 Apple Developer account + the secrets below.
#                                 Use this for managed beta distribution.
#
# WHY A macOS RUNNER: iOS apps can only be compiled, signed and packaged by
# Xcode, which is macOS-only. There is no Windows or Linux path.
#
# WHY NO AUTO-UPDATE FEED: Apple does not permit replacing the app binary
# outside the App Store, so there is no equivalent of the S3 latest.yml feed
# release-aac.yml publishes. iPad binary updates ship through TestFlight / the
# App Store. (OTA swapping of the *web bundle* is scaffolded in
# capacitor.config.ts but switched off until the shell is verified on a device.)
#
# ── REQUIRED SECRETS ────────────────────────────────────────────────────────
# Create these in Settings → Secrets and variables → Actions:
#
#   APPLE_TEAM_ID              10-char Apple Developer Team ID (Membership page).
#   APP_STORE_CONNECT_KEY_ID   App Store Connect API key id (10 chars).
#   APP_STORE_CONNECT_ISSUER_ID  Issuer UUID shown above the key list.
#   APP_STORE_CONNECT_KEY_P8   Full contents of the AuthKey_XXXX.p8, including
#                              the BEGIN/END PRIVATE KEY lines. Downloadable
#                              ONCE. Create at App Store Connect → Users and
#                              Access → Integrations → App Store Connect API,
#                              "App Manager" role.
#
# Before the first run you must also create the app record in App Store Connect
# with bundle id com.aivota.aac (matching capacitor.config.ts), or the upload
# fails with "no suitable application record".
#
# Trigger: manual only for now (workflow_dispatch). Once verified, wire it to
# the same `v*` tags as release-aac.yml.

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend the build talks to (baked as VITE_API_URL)'
        required: false
        default: 'https://api.aivota.ai'
      upload:
        description: 'Upload to TestFlight (uncheck to just get a signed .ipa artifact)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-aac-ios
  cancel-in-progress: false

jobs:
  build:
    name: Build & upload to TestFlight
    # macos-15, not macos-latest: `latest` moves between images without warning,
    # and the image is what decides which Xcodes exist for the pin below.
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # MAJOR version of Xcode to build with. App Store Connect enforces a
      # MINIMUM SDK on upload, so inheriting `xcode-select`'s default means a
      # runner-image refresh can silently change what a store build is compiled
      # against — and the symptom is a rejected upload after a 40-minute build,
      # not a compile error. Pinned to the major only: patch releases come and
      # go on the image, SDK generations do not.
      XCODE_VERSION: '26'
      # The floor asserted below. Apple raises this each spring; when it moves,
      # bump both of these together.
      MIN_IOS_SDK: '26.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before anything expensive so a bad pin costs seconds, not a build.
      - name: Pin Xcode and verify the iOS SDK
        run: |
          echo "Xcode versions on this runner image:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"

          # `|| true`: this step runs under `bash -eo pipefail`, where an `ls`
          # that matches nothing would abort before the legible error below.
          CANDIDATES=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null || true)
          # Version sort, so 26.10 beats 26.2. BSD sort has taken -V for years
          # but the fallback keeps a missing flag from reading as a missing Xcode.
          SORT_FLAGS='-Vr'
          printf '1.0\n' | sort -Vr >/dev/null 2>&1 || SORT_FLAGS='-r'
          DEV=""
          if [ -n "$CANDIDATES" ]; then
            DEV="$(printf '%s\n' "$CANDIDATES" | sort $SORT_FLAGS | head -1)/Contents/Developer"
          fi
          if [ -z "$CANDIDATES" ] || [ ! -d "$DEV" ]; then
            echo "::error::No Xcode ${XCODE_VERSION}.x on this runner image. Pick one from the list above and set XCODE_VERSION at the top of this workflow (and in build-aac-ios-unsigned.yml, which must match — a smoke test on a different toolchain proves nothing)."
            exit 1
          fi
          sudo xcode-select -s "$DEV"
          xcodebuild -version

          SDK=$(xcodebuild -version -sdk iphoneos SDKVersion)
          echo "iOS SDK: $SDK (required minimum $MIN_IOS_SDK)"
          awk -v have="$SDK" -v want="$MIN_IOS_SDK" 'BEGIN {
            split(have, h, "."); split(want, w, ".");
            for (i = 1; i <= 3; i++) {
              if (h[i] + 0 > w[i] + 0) exit 0;
              if (h[i] + 0 < w[i] + 0) exit 1;
            }
            exit 0
          }' || {
            echo "::error::iOS SDK $SDK is below App Store Connect's minimum of $MIN_IOS_SDK. The archive would build and the upload would be rejected."
            exit 1
          }

          # altool is deprecated and Apple has said it will be removed. It is
          # still the upload path at the bottom of this workflow, so check it
          # survived the pinned Xcode here rather than after the archive.
          if [ "${{ inputs.upload }}" = "true" ] && ! xcrun --find altool >/dev/null 2>&1; then
            echo "::error::Xcode ${XCODE_VERSION} no longer ships altool. Switch the 'Upload to TestFlight' step to iTMSTransporter, or to xcodebuild -exportArchive with <destination>upload</destination> in ExportOptions.plist (it can reuse the App Store Connect key already written above)."
            exit 1
          fi

          echo "XCODE_SELECTED=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail early and legibly rather than 40 minutes later inside xcodebuild.
      - name: Verify required secrets are present
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ]   && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ]    && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$KEY_P8" ]    && missing="$missing APP_STORE_CONNECT_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see the header of this workflow file. (For unsigned testing without secrets, use the 'Build AAC iPad (unsigned)' workflow instead.)"
            exit 1
          fi
          echo "All required secrets present."

      # Builds dist/public-aac with a RELATIVE asset base (NATIVE_BUILD=1) and
      # the backend baked in. Identical bundle to the Windows build except for
      # VITE_API_URL.
      - name: Build web bundle
        env:
          VITE_API_URL: ${{ inputs.backend_url }}
          # Runtime backend manifest (client-aac/src/lib/api-base.ts): lets an
          # installed build be re-pointed without a new TestFlight release.
          VITE_BACKEND_MANIFEST_URL: https://updates.aivota.ai/aac/latest-backend.json
        run: npm run ios:build

      # `ios/` is gitignored; generate it fresh from the Capacitor template.
      #
      # --packagemanager CocoaPods is REQUIRED. Capacitor 8 defaults `cap add`
      # to Swift Package Manager (the default template is ios-spm-template.tar.gz),
      # and the SPM template ships NO standalone App.xcworkspace and NO Podfile —
      # so the Archive step below, which builds `-workspace App.xcworkspace`,
      # fails with "App.xcworkspace does not exist." The CocoaPods template
      # restores the workspace; Capacitor detects the package manager by artifact
      # (absence of CapApp-SPM/ ⇒ CocoaPods), so `cap sync` runs `pod install`.
      - name: Generate iOS project
        run: npx cap add ios --packagemanager CocoaPods

      # Copies the web bundle in, runs `pod install`, then applies our
      # Info.plist customizations (camera/mic/local-network usage strings,
      # orientation, full-screen). See scripts/ios-configure.mjs.
      - name: Sync + configure iOS project
        run: npm run ios:sync

      # Fail here with a clear message rather than deep inside xcodebuild if the
      # workspace is missing — the symptom of an SPM project sneaking back in.
      - name: Verify Xcode workspace exists
        run: |
          if [ ! -d ios/App/App.xcworkspace ]; then
            echo "::error::ios/App/App.xcworkspace was not generated. Capacitor produced an SPM project instead of a CocoaPods one — check the 'Generate iOS project' step used --packagemanager CocoaPods, and that 'pod install' ran during sync."
            echo "Contents of ios/App:"
            ls -la ios/App || true
            exit 1
          fi
          echo "Found ios/App/App.xcworkspace."

      # Version the build from package.json. CFBundleVersion must strictly
      # increase for every TestFlight upload, so the run number is used.
      - name: Set version and build number
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Marketing version: $VERSION, build: $GITHUB_RUN_NUMBER"
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" App/Info.plist

      - name: Write App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      # -allowProvisioningUpdates lets Xcode create/refresh the signing
      # certificate and provisioning profile via the API key, so no certificates
      # need to be exported from a Mac we don't have.
      - name: Archive (signed)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # Keep the signed IPA even when not uploading, so a build-only run is still
      # useful (validate the signing chain without pushing to testers).
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivota-aac-ipad-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA to TestFlight"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Aivota AAC iPad — signed build"
            echo ""
            echo "- Version: $(node -p "require('./package.json').version") (build $GITHUB_RUN_NUMBER)"
            echo "- Backend: ${{ inputs.backend_url }}"
            # Recorded because App Review rejections cite the SDK a build was
            # compiled against, and `ios/` is not committed anywhere to check.
            echo "- Toolchain: Xcode ${XCODE_SELECTED:-unknown}, iOS SDK ${IOS_SDK:-unknown}"
            echo "- Uploaded to TestFlight: ${{ inputs.upload }}"
            echo ""
            if [ "${{ inputs.upload }}" = "true" ]; then
              echo "Processing on Apple's side takes ~5-15 minutes before the build"
              echo "appears in TestFlight. Add testers in App Store Connect → TestFlight;"
              echo "the tester installs Apple's TestFlight app, then installs this build."
            else
              echo "Build-only run — download the signed .ipa from this run's Artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
