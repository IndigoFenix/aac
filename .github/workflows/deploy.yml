name: Deploy to AWS (ECS)

# Production deploy for the `main` branch: Terraform → ECS Fargate image →
# static frontends to S3/CloudFront. `staging` is NOT deployed here — it runs
# on Render. The Lambda path (deploy-lambda.yml) is legacy and manual-only.
#
# Profiles (terraform/<profile>.tfvars, layered on terraform/terraform.tfvars):
#   ecs-lean  — default; lean security, 1 task, no Redis
#   hipaa     — full compliance: WAF, CloudTrail, flow logs, VPC endpoints,
#               2+ tasks + Redis, multi-AZ RDS. Flip DEFAULT_PROFILE below (or
#               dispatch with deploy_profile=hipaa) to switch — nothing is
#               recreated, flags flip in place.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_profile:
        description: 'Terraform profile'
        required: true
        default: 'ecs-lean'
        type: choice
        options:
          - ecs-lean
          - hipaa

env:
  AWS_REGION: il-central-1
  ENVIRONMENT: prod
  DEFAULT_PROFILE: ecs-lean   # ← change to `hipaa` to make every push deploy the compliant profile

permissions:
  id-token: write
  contents: read

# One deploy at a time; a second push queues behind the running one rather
# than racing it for the Terraform lock / ECS deployment.
concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================
  # Security Scanning
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ===========================================
  # Lint + Type-check (gate for accessibility regressions)
  # ===========================================
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type-check across server + shared (no client tsc here — pre-existing
      # errors documented in memory; CI for those would be a separate gate).
      - name: Type-check (server + shared)
        run: npm run check

      # WCAG-relevant lint. Errors fail the build; the 0/0 baseline was
      # established 2026-05-07 and this gate keeps it. Warnings allowed.
      - name: Lint a11y rules
        run: npm run lint:a11y

  # ===========================================
  # Infrastructure (Terraform)
  # ===========================================
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    needs: [security-scan, lint]
    if: github.ref == 'refs/heads/main'
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      frontend_bucket: ${{ steps.tf-outputs.outputs.frontend_bucket }}
      cloudfront_id: ${{ steps.tf-outputs.outputs.cloudfront_id }}
      app_cloudfront_id: ${{ steps.tf-outputs.outputs.app_cloudfront_id }}
      ecr_url: ${{ steps.tf-outputs.outputs.ecr_url }}
      ecs_cluster: ${{ steps.tf-outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.tf-outputs.outputs.ecs_service }}
      ecs_task_family: ${{ steps.tf-outputs.outputs.ecs_task_family }}
      ecs_container: ${{ steps.tf-outputs.outputs.ecs_container }}
      ecs_active: ${{ steps.tf-outputs.outputs.ecs_active }}
      api_url: ${{ steps.tf-outputs.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deploy profile
        id: profile
        run: |
          PROFILE="${{ github.event.inputs.deploy_profile || env.DEFAULT_PROFILE }}"
          if [ ! -f "terraform/${PROFILE}.tfvars" ]; then
            echo "::error::Unknown profile '${PROFILE}' (no terraform/${PROFILE}.tfvars)"
            exit 1
          fi
          echo "profile=${PROFILE}" >> $GITHUB_OUTPUT
          if [ "$PROFILE" = "hipaa" ]; then
            echo "::notice::Using HIPAA profile (full security/compliance)"
          else
            echo "::notice::Using ECS-LEAN profile (security/monitoring add-ons disabled)"
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # 1.6.0 ships an old trust root that doesn't accept providers re-signed
          # with HashiCorp's newer keys, producing "openpgp: key expired". 1.10+
          # has the refreshed trust store.
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Ensure Terraform state backend exists
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          # Create S3 state bucket if it doesn't exist
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Creating Terraform state bucket: $STATE_BUCKET"
            aws s3api create-bucket \
              --bucket "$STATE_BUCKET" \
              --region "${{ env.AWS_REGION }}" \
              --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
            aws s3api put-bucket-versioning \
              --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          # Create DynamoDB lock table if it doesn't exist
          if ! aws dynamodb describe-table --table-name terraform-state-lock --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Creating DynamoDB lock table: terraform-state-lock"
            aws dynamodb create-table \
              --table-name terraform-state-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}"
            aws dynamodb wait table-exists --table-name terraform-state-lock --region "${{ env.AWS_REGION }}"
          fi

          # Fix stale DynamoDB digest: if the state checksum doesn't match the
          # digest stored in DynamoDB, delete the stale digest entry so
          # terraform init can re-read the state cleanly.
          STATE_KEY="aivota/${{ env.ENVIRONMENT }}/terraform.tfstate"
          LOCK_ID="${STATE_BUCKET}/${STATE_KEY}-md5"
          STORED_DIGEST=$(aws dynamodb get-item \
            --table-name terraform-state-lock \
            --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Item.Digest.S" --output text 2>/dev/null || echo "")

          if [ -n "$STORED_DIGEST" ] && [ "$STORED_DIGEST" != "None" ]; then
            ACTUAL_MD5=$(aws s3api head-object \
              --bucket "$STATE_BUCKET" \
              --key "$STATE_KEY" \
              --region "${{ env.AWS_REGION }}" \
              --query "ETag" --output text 2>/dev/null | tr -d '"' || echo "")

            if [ "$STORED_DIGEST" != "$ACTUAL_MD5" ]; then
              echo "DynamoDB digest mismatch (stored=$STORED_DIGEST, actual=$ACTUAL_MD5). Removing stale entry."
              aws dynamodb delete-item \
                --table-name terraform-state-lock \
                --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
                --region "${{ env.AWS_REGION }}"
            fi
          fi

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=aivota/${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="${{ steps.profile.outputs.profile }}.tfvars" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf-outputs
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: |
          out() { terraform output -raw "$1" 2>/dev/null || echo ''; }
          echo "frontend_bucket=$(out frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(out cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "app_cloudfront_id=$(out app_cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "ecr_url=$(out ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(out ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(out ecs_service_name)" >> $GITHUB_OUTPUT
          echo "ecs_task_family=$(out ecs_task_family)" >> $GITHUB_OUTPUT
          echo "ecs_container=$(out ecs_container_name)" >> $GITHUB_OUTPUT
          echo "ecs_active=$(out ecs_active)" >> $GITHUB_OUTPUT
          echo "api_url=$(out api_url)" >> $GITHUB_OUTPUT

  # ===========================================
  # Build Frontend (S3 + CloudFront)
  # ===========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event_name != 'pull_request' && needs.infrastructure.outputs.frontend_bucket != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (main + AAC)
        run: |
          npm run build:client
          npm run prerender:landing
          npm run build:client-aac
        env:
          NODE_ENV: production
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          # Canonical/sitemap URLs for the prerendered landing pages.
          PRERENDER_ORIGIN: https://aivota.ai

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            dist/public/
            dist/public-aac/
          retention-days: 1

  # ===========================================
  # Build and Push API Image
  # ===========================================
  build-image:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event_name != 'pull_request' && needs.infrastructure.outputs.ecr_url != ''
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_URL: ${{ needs.infrastructure.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --provenance=false -f Dockerfile -t $ECR_URL:$IMAGE_TAG .
          docker push $ECR_URL:$IMAGE_TAG
          docker tag $ECR_URL:$IMAGE_TAG $ECR_URL:latest
          docker push $ECR_URL:latest
          echo "image=$ECR_URL:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ===========================================
  # Deploy Frontend to S3
  # ===========================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [infrastructure, build-frontend]
    if: github.event_name != 'pull_request' && needs.infrastructure.outputs.frontend_bucket != ''

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Deploy to S3
        env:
          BUCKET: ${{ needs.infrastructure.outputs.frontend_bucket }}
        run: |
          echo "Deploying to bucket: $BUCKET"

          # === Main client (/) ===
          # Bulk-sync hashed assets with year-long immutable caching. Exclude
          # files we'll re-upload below with weaker cache headers (HTML and
          # SEO files change with every deploy, JSON shouldn't be frozen).
          aws s3 sync dist/public/ s3://$BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*/index.html" \
            --exclude "*.json" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt" \
            --exclude "aac/*"

          # Root + per-locale prerendered landing pages — no-cache so language
          # tweaks roll out on the next deploy without a manual invalidation.
          aws s3 cp dist/public/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          for d in dist/public/*/; do
            locale="$(basename "$d")"
            if [ "$locale" = "aac" ] || [ "$locale" = "assets" ]; then
              continue
            fi
            if [ -f "${d}index.html" ]; then
              aws s3 cp "${d}index.html" "s3://$BUCKET/$locale/index.html" \
                --cache-control "no-cache, no-store, must-revalidate"
            fi
          done

          # SEO files — short cache so search engines pick up updates promptly.
          if [ -f dist/public/sitemap.xml ]; then
            aws s3 cp dist/public/sitemap.xml s3://$BUCKET/sitemap.xml \
              --cache-control "public, max-age=3600" \
              --content-type "application/xml"
          fi
          if [ -f dist/public/robots.txt ]; then
            aws s3 cp dist/public/robots.txt s3://$BUCKET/robots.txt \
              --cache-control "public, max-age=3600" \
              --content-type "text/plain"
          fi

          # Upload JSON files with short cache
          for f in $(find dist/public -name "*.json" -type f 2>/dev/null); do
            key="${f#dist/public/}"
            aws s3 cp "$f" "s3://$BUCKET/$key" \
              --cache-control "public, max-age=0, must-revalidate"
          done

          # === AAC client (/aac/) ===
          if [ -d "dist/public-aac" ]; then
            echo "Deploying AAC client to /aac/"

            aws s3 sync dist/public-aac/ s3://$BUCKET/aac/ \
              --delete \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude "index.html" \
              --exclude "*.json"

            aws s3 cp dist/public-aac/index.html s3://$BUCKET/aac/index.html \
              --cache-control "no-cache, no-store, must-revalidate"

            for f in $(find dist/public-aac -name "*.json" -type f 2>/dev/null); do
              key="${f#dist/public-aac/}"
              aws s3 cp "$f" "s3://$BUCKET/aac/$key" \
                --cache-control "public, max-age=0, must-revalidate"
            done
          fi

      - name: Invalidate CloudFront caches
        env:
          CF_ID: ${{ needs.infrastructure.outputs.cloudfront_id }}
          APP_CF_ID: ${{ needs.infrastructure.outputs.app_cloudfront_id }}
        run: |
          if [ -n "$CF_ID" ]; then
            echo "Invalidating landing page CloudFront: $CF_ID"
            aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"
          fi
          if [ -n "$APP_CF_ID" ]; then
            echo "Invalidating app CloudFront: $APP_CF_ID"
            aws cloudfront create-invalidation --distribution-id $APP_CF_ID --paths "/*"
          fi

  # ===========================================
  # Deploy to ECS
  # ===========================================
  deploy-ecs:
    name: Deploy ECS
    runs-on: ubuntu-latest
    needs: [infrastructure, build-image]
    if: github.event_name != 'pull_request' && needs.infrastructure.outputs.ecs_active == 'true'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Terraform owns the task definition template (env, secrets, sizing);
      # the deploy only swaps the image onto its latest revision. Strip the
      # read-only fields describe-task-definition returns so register accepts it.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ needs.infrastructure.outputs.ecs_task_family }}" \
            --query taskDefinition \
          | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
          > task-definition.json

      - name: Render task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ needs.infrastructure.outputs.ecs_container }}
          image: ${{ needs.build-image.outputs.image }}

      # Migrations run inside the new task at boot (app.prod.ts, advisory
      # lock). The circuit breaker rolls back automatically if the new tasks
      # never pass the ALB health check.
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ needs.infrastructure.outputs.ecs_service }}
          cluster: ${{ needs.infrastructure.outputs.ecs_cluster }}
          wait-for-service-stability: true
          wait-for-minutes: 20

  # ===========================================
  # Post-deployment health check
  # ===========================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [infrastructure, deploy-ecs]
    if: github.event_name != 'pull_request' && needs.infrastructure.outputs.api_url != ''

    steps:
      - name: Wait for the API to report healthy
        env:
          API_URL: ${{ needs.infrastructure.outputs.api_url }}
        run: |
          echo "Checking ${API_URL}/health"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${API_URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API healthy"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "::error::API did not become healthy at ${API_URL}/health"
          exit 1

  # ===========================================
  # Summary
  # ===========================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [infrastructure, build-frontend, build-image, deploy-frontend, deploy-ecs, health-check]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Summary
        run: |
          {
            echo "## Deployment Summary (${{ needs.infrastructure.outputs.profile }})"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| Infrastructure | ${{ needs.infrastructure.result }} |"
            echo "| Build Frontend | ${{ needs.build-frontend.result }} |"
            echo "| Build API Image | ${{ needs.build-image.result }} |"
            echo "| Deploy Frontend | ${{ needs.deploy-frontend.result }} |"
            echo "| Deploy ECS | ${{ needs.deploy-ecs.result }} |"
            echo "| Health Check | ${{ needs.health-check.result }} |"
            echo ""
            echo "**App:** https://app.aivota.ai"
            echo "**API:** ${{ needs.infrastructure.outputs.api_url }}"
          } >> $GITHUB_STEP_SUMMARY
